<header class="navbar">
  <div class="navbar__brand">
    <h1>ScholarFlow</h1>
    <p>RESEARCH KNOWLEDGE MANAGEMENT SYSTEM · API GATEWAY PREVIEW</p>
  </div>

  <div class="navbar__actions">
    <a class="navbar__profile" [routerLink]="profileRoute() || defaultRoute()">
      <span class="material-icons">account_circle</span>
      <span class="navbar__profile-meta" *ngIf="user() as currentUser">
        <strong>{{ currentUser.firstName }} {{ currentUser.lastName }}</strong>
        <small>{{ roleDisplayName(currentUser.role) }}</small>
      </span>
    </a>
    <button type="button" class="navbar__logout" (click)="logout()">Logout</button>
  </div>
</header>
