spring.application.name=api-gateway

server.port=8080

jwt.secret=${RKMS_JWT_SECRET:${JWT_SECRET:change-me-local-dev-secret-key-32bytes!}}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}

spring.cloud.gateway.server.webflux.globalcors.corsConfigurations.[/**].allowedOrigins=${app.cors.allowed-origin}
spring.cloud.gateway.server.webflux.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.corsConfigurations.[/**].allowCredentials=true

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webflux.routes[2].id=paper-service
spring.cloud.gateway.server.webflux.routes[2].uri=${PAPER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/papers/**

spring.cloud.gateway.server.webflux.routes[3].id=publication-service
spring.cloud.gateway.server.webflux.routes[3].uri=${PAPER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/publications/**

spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/notifications/**

spring.cloud.gateway.server.webflux.routes[5].id=review-researcher-service
spring.cloud.gateway.server.webflux.routes[5].uri=${REVIEW_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/researcher/**

spring.cloud.gateway.server.webflux.routes[6].id=review-reviewer-service
spring.cloud.gateway.server.webflux.routes[6].uri=${REVIEW_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/reviewer/**

spring.cloud.gateway.server.webflux.routes[7].id=review-editor-service
spring.cloud.gateway.server.webflux.routes[7].uri=${REVIEW_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/editor/**

spring.cloud.gateway.server.webflux.routes[8].id=report-service
spring.cloud.gateway.server.webflux.routes[8].uri=${REPORT_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/report/**
