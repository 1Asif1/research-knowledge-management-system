services:
  postgres:
    image: postgres:16
    container_name: rkms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10

  userservice:
    build:
      context: .
      dockerfile: userservice/Dockerfile
    image: ${DOCKER_USERNAME:-yourusername}/rkms-userservice:latest
    container_name: rkms-userservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/RKMSNEW
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  authservice:
    build:
      context: .
      dockerfile: AuthServiceD/Dockerfile
    image: ${DOCKER_USERNAME:-yourusername}/rkms-authservice:latest
    container_name: rkms-authservice
    environment:
      USER_SERVICE_URL: http://userservice:8081
      APP_CORS_ALLOWED_ORIGIN: "*"
    ports:
      - "8082:8082"
    depends_on:
      - userservice

  notificationservice:
    build:
      context: .
      dockerfile: notificationservice/Dockerfile
    image: ${DOCKER_USERNAME:-yourusername}/rkms-notificationservice:latest
    container_name: rkms-notificationservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/RKMSNEW
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  paperservice:
    build:
      context: .
      dockerfile: PaperService/Dockerfile
    image: ${DOCKER_USERNAME:-yourusername}/rkms-paperservice:latest
    container_name: rkms-paperservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/RKMSNEW
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      USER_SERVICE_URL: http://userservice:8081
      NOTIFICATION_SERVICE_URL: http://notificationservice:8084
      REVIEW_SERVICE_URL: http://reviewservice:8085
      REPORT_SERVICE_URL: http://reportservice:8086
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      userservice:
        condition: service_started

  reviewservice:
    build:
      context: .
      dockerfile: ReviewService/Dockerfile
    image: ${DOCKER_USERNAME:-yourusername}/rkms-reviewservice:latest
    container_name: rkms-reviewservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/RKMSNEW
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PAPER_SERVICE_URL: http://paperservice:8083
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

  reportservice:
    build:
      context: .
      dockerfile: ReportService/Dockerfile
    image: ${DOCKER_USERNAME:-yourusername}/rkms-reportservice:latest
    container_name: rkms-reportservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/RKMSNEW
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: ${DOCKER_USERNAME:-yourusername}/rkms-api-gateway:latest
    container_name: rkms-api-gateway
    environment:
      AUTH_SERVICE_URL: http://authservice:8082
      USER_SERVICE_URL: http://userservice:8081
      PAPER_SERVICE_URL: http://paperservice:8083
      NOTIFICATION_SERVICE_URL: http://notificationservice:8084
      REVIEW_SERVICE_URL: http://reviewservice:8085
      REPORT_SERVICE_URL: http://reportservice:8086
      APP_CORS_ALLOWED_ORIGIN: "*"
    ports:
      - "8080:8080"
    depends_on:
      - authservice
      - userservice
      - paperservice
      - notificationservice
      - reviewservice
      - reportservice

  research-frontend:
    build:
      context: .
      dockerfile: research-frontend-main/Dockerfile
    image: ${DOCKER_USERNAME:-yourusername}/rkms-frontend:latest
    container_name: rkms-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

volumes:
  postgres-data:
